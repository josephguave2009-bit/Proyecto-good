name: Spawnly beta checks
on:
  push:
    branches:
      - feature/spawnly-real-social
      - main
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          for file in js/*.js js/pages/*.js js/components/*.js; do node --check "$file"; done
      - name: Unit tests
        run: node --test tests/store.test.mjs tests/social-hub.test.mjs
